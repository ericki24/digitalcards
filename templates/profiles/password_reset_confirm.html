<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Contraseña - ProfileSaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    form p { margin-bottom: 1rem; display: flex; flex-direction: column; text-align: left; }
    form label { font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.35rem; text-transform: uppercase; }
    form input { background-color: #020617; border: 1px solid #1e293b; border-radius: 0.75rem; padding: 0.75rem 1rem; color: #ffffff; font-size: 0.875rem; outline: none; }
    form input:focus { border-color: #14b8a6; }
    form ul { font-size: 0.7rem; color: #f87171; list-style-type: disc; padding-left: 1rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
    <h1 class="text-2xl font-bold text-white">Nueva Contraseña</h1>
    <p class="text-xs text-slate-400">Ingresa tu nueva contraseña dos veces para confirmar el cambio.</p>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-3 px-4 rounded-xl text-sm transition-all">
        Guardar nueva contraseña
      </button>
    </form>
  </div>
</body>
</html>
