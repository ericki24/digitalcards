<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correo Enviado - ProfileSaaS</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-200 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-10 antialiased">

  <!-- CONTENEDOR PRINCIPAL FLOTANTE DE BORDES MUY REDONDEADOS -->
  <div class="max-w-5xl w-full bg-slate-50 rounded-[2.5rem] shadow-2xl border border-slate-300/60 p-4 sm:p-6 md:p-8 grid grid-cols-1 md:grid-cols-12 gap-6 items-center relative">

    <!-- SECCIÓN IZQUIERDA: MENSAJE DE CONFIRMACIÓN (7 COLUMNAS) -->
    <div class="md:col-span-7 px-2 sm:px-6 py-4 flex flex-col justify-between h-full space-y-6">

      <!-- Botón Volver al Login -->
      <div>
        <a href="{% url 'login' %}" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 bg-white hover:bg-slate-100 border border-slate-200/80 shadow-xs transition-all">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-slate-500"></i>
          <span>Volver al Iniciar Sesión</span>
        </a>
      </div>

      <div class="max-w-md w-full mx-auto space-y-6 text-center md:text-left">
        
        <!-- Ícono de Éxito Circular -->
        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-2xl flex items-center justify-center mx-auto md:mx-0 shadow-sm">
          <i data-lucide="check-circle-2" class="w-7 h-7"></i>
        </div>

        <!-- Encabezado y Texto -->
        <div class="space-y-2">
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">Revisa tu correo</h1>
          <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
            Hemos enviado las instrucciones a tu correo electrónico para que puedas recuperar el acceso a tu cuenta.
          </p>
        </div>


        <!-- Botón de Acción -->
        <div class="pt-2">
          <a href="{% url 'login' %}" class="w-full inline-flex justify-center items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 px-4 rounded-2xl text-sm transition-all shadow-md hover:shadow-lg">
            <i data-lucide="log-in" class="w-4 h-4"></i> Ir a iniciar sesión
          </a>
        </div>

      </div>

      <!-- Pie de página discreto -->
      <div class="text-center text-[11px] text-slate-400 pt-4">
        © 2026 Plataforma de Tarjetas Digitales
      </div>

    </div>

    <!-- SECCIÓN DERECHA: BANNER VISUAL CON GRADIENTE (5 COLUMNAS) -->
      


      <!-- Header del Banner -->
      <div class="relative z-10 flex items-center gap-7">
        <div class="w-8 h-8 rounded-xl bg-black/10 backdrop-blur-md flex items-center justify-center border border-white/10">
          <i data-lucide="send" class="w-4 h-4 text-teal-400"></i>
        </div>
        <span class="text-xs font-bold tracking-wider uppercase text-slate-300">ProfileSaaS Delivery</span>
      </div>




  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
